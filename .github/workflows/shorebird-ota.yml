name: Shorebird OTA Updates
# ──────────────────────────────────────────────────────────────────────────────
# Handles OTA updates via Shorebird.
# Detects whether changes require a full native release or just a Dart patch.
# Runs automatically on push to main or can be triggered manually.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a full native release instead of a patch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Native Changes
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check for Native Changes
        id: check
        run: |
          # If forced via manual dispatch, always release
          if [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "needs_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if android/ or ios/ or pubspec.yaml changed since last commit
          # Note: pubspec.yaml changes (like new plugins) often require native rebuilds
          if git diff --name-only HEAD^ HEAD | grep -E '^(android/|ios/|pubspec.yaml|shorebird.yaml)'; then
            echo "Native code or dependencies changed. Full release required."
            echo "needs_release=true" >> $GITHUB_OUTPUT
          else
            echo "Only Dart/Flutter code changed. Patch is sufficient."
            echo "needs_release=false" >> $GITHUB_OUTPUT
          fi

  shorebird-patch:
    name: Shorebird Patch (Dart Only)
    needs: detect-changes
    if: needs_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        
      - name: Shorebird Patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # In a multi-school setup, you would loop through schools or use flavors.
          # For now, we patch the main release.
          shorebird patch android --force

  shorebird-release:
    name: Shorebird Release (Native Changes)
    needs: detect-changes
    if: needs_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        
      - name: Shorebird Release
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # Creates a new base release in Shorebird and builds the APK/AAB
          shorebird release android --force
          
      # Here you would typically upload the APK to GitHub Releases or Play Store
